<svg width="1200" height="460" viewBox="0 0 1200 460" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="460" gradientUnits="userSpaceOnUse">
    <stop stop-color="#050A14"/><stop offset="1" stop-color="#02050A"/>
  </linearGradient>
  <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(270 235) rotate(90) scale(125)">
    <stop stop-color="#00D9FF" stop-opacity=".85"/><stop offset="1" stop-color="#0057B8" stop-opacity="0"/>
  </radialGradient>
  <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#20354A" fill-opacity=".45"/>
  </pattern>
  <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".45"/>
  </filter>
</defs>

<rect x="2" y="2" width="1196" height="456" rx="22" fill="url(#bg)" stroke="#00A8FF" stroke-opacity=".65" stroke-width="2"/>
<rect x="3" y="3" width="1194" height="454" rx="21" fill="url(#dots)"/>

<!-- Header -->
<text x="38" y="55" fill="#00E5FF" font-family="monospace" font-size="14" font-weight="700" letter-spacing="4"> </text>
<text x="38" y="92" fill="#EAF7FF" font-family="Arial, sans-serif" font-size="27" font-weight="700"> </text>

<!-- Left visual -->
<circle cx="270" cy="235" r="145" fill="url(#glow)"/>
<g opacity=".55" stroke="#87c1d1" stroke-width="1.5">
  <ellipse cx="270" cy="235" rx="155" ry="72" transform="rotate(25 270 235)"/>
  <ellipse cx="270" cy="235" rx="155" ry="72" transform="rotate(-25 270 235)"/>
  <ellipse cx="270" cy="235" rx="155" ry="72" transform="rotate(90 270 235)"/>
</g>
<circle cx="270" cy="235" r="56" fill="#09a1ec" fill-opacity=".18" stroke="#00C8FF" stroke-width="2" filter="url(#shadow)"/>
<circle cx="270" cy="235" r="43" fill="#008CFF"/>
<text x="270" y="247" text-anchor="middle" fill="white" font-family="monospace" font-size="30" font-weight="700">&lt;/&gt;</text>

<!-- orbit nodes -->
<!-- orbit nodes -->
<g font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">
  <circle cx="120" cy="145" r="20" fill="#050A14" stroke="#F59E0B"/>
  <text x="120" y="149" fill="#bb91b5">Py</text>

  <circle cx="425" cy="145" r="20" fill="#050A14" stroke="#F59E0B"/>
  <text x="425" y="149" fill="#bb91b5">asm</text>

  <circle cx="104" cy="292" r="20" fill="#050A14" stroke="#F59E0B"/>
  <text x="104" y="296" fill="#bb91b5">C++</text>

  <circle cx="435" cy="305" r="20" fill="#050A14" stroke="#F59E0B"/>
  <text x="435" y="309" fill="#bb91b5">Sql</text>

  <!-- Java moved slightly downward -->
  <circle cx="270" cy="415" r="20" fill="#050A14" stroke="#F59E0B"/>
  <text x="270" y="415" fill="#bb91b5">Java</text>

  <!-- ipynb moved slightly upward -->
  <circle cx="270" cy="55" r="20" fill="#050A14" stroke="#F59E0B"/>
  <text x="270" y="54" fill="#bb91b5">ipynb</text>
</g>

<!-- Divider -->
<line x1="520" y1="105" x2="520" y2="410" stroke="#20354A"/>

<!-- Section labels -->
<g font-family="monospace" font-size="15" font-weight="700" letter-spacing="2">
  <text x="555" y="132" fill="#f1f7aa">ML / AI</text>
  <text x="555" y="208" fill="#f1f7aa"> Interpretability</text>
  <text x="555" y="284" fill="#f1f7aa">Web Frameworks &amp; DATA</text>
  <text x="555" y="360" fill="#f1f7aa">TOOLS &amp; WORKFLOW</text>
</g>

